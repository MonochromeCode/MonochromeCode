# GitHub Action for generating a contribution graph with a snake eating your contributions.

name: Generate Animation

on:
  # run automatically every 12 hours (UTC)
  schedule:
    - cron: "30 8,23 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

  # 推送到 main 时重新生成
  push:
    branches:
      - main
    paths-ignore:
      - "assets/**"

# 避免多个任务同时推送 main 互相冲突
concurrency:
  group: generate-animation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate Snake
        uses: Platane/snk@v3
        id: snake-animation
        with:
          github_user_name: MonochromeCode
          outputs: |
            ./assets/github-contribution-grid-snake.gif
            ./assets/github-contribution-grid-snake.svg
            ./assets/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Touch timestamp for guaranteed commit
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > assets/.last-generated
          echo "run_id=${{ github.run_id }}" >> assets/.last-generated
          echo "event=${{ github.event_name }}" >> assets/.last-generated

      - name: Push to GitHub
        uses: EndBug/add-and-commit@v11
        with:
          add: "assets"
          author_name: MonochromeCode
          author_email: 49807636+MonochromeCode@users.noreply.github.com
          message: "Generate Github contribution heatmap animation"
          pull: --rebase --autostash
          push_attempts: "5"
