# Independent scheduled workflow (new file so GitHub registers a fresh schedule).
# The original main.yml was created while this repo was still a fork;
# GitHub disables cron on forks and may never attach schedule to that old workflow.

name: Hourly Animation

on:
  # 每小时一次（UTC :23），避开整点/:30 高峰
  # 对应北京时间每小时 23 分
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: generate-animation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pick snake style for this run
        id: style
        run: |
          colors=(green lime orange gold tomato deepskyblue mediumorchid hotpink cyan coral)
          idx=$(( ${{ github.run_number }} % ${#colors[@]} ))
          snake="${colors[$idx]}"
          echo "snake=${snake}" >> "$GITHUB_OUTPUT"
          echo "Using color_snake=${snake}"

      - name: Record run timestamp
        run: |
          {
            echo "generated_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "run_id=${{ github.run_id }}"
            echo "run_number=${{ github.run_number }}"
            echo "event=${{ github.event_name }}"
            echo "color_snake=${{ steps.style.outputs.snake }}"
          } > assets/.last-generated

      - name: Commit timestamp first
        uses: EndBug/add-and-commit@v11
        with:
          add: "assets/.last-generated"
          author_name: MonochromeCode
          author_email: 49807636+MonochromeCode@users.noreply.github.com
          message: "chore: bump contribution keepalive"
          pull: --no-rebase --no-edit
          push_attempts: "5"

      - name: Wait for contribution graph refresh
        run: sleep 45

      - name: Generate Snake
        uses: Platane/snk@v3
        id: snake-animation
        with:
          github_user_name: MonochromeCode
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            ./assets/github-contribution-grid-snake.gif?color_snake=${{ steps.style.outputs.snake }}
            ./assets/github-contribution-grid-snake.svg?color_snake=${{ steps.style.outputs.snake }}
            ./assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=${{ steps.style.outputs.snake }}

      - name: Commit updated snake
        uses: EndBug/add-and-commit@v11
        with:
          add: "assets"
          author_name: MonochromeCode
          author_email: 49807636+MonochromeCode@users.noreply.github.com
          message: "Generate Github contribution heatmap animation"
          pull: --no-rebase --no-edit
          push_attempts: "5"
